name: keoni
# Stack Keoni IA production.
# L'image matching-api est buildée par la CI (.github/workflows/ci.yml) et
# poussée sur GHCR -- ce compose ne fait que la tirer (MATCHING_API_IMAGE /
# IMAGE_TAG passés en environnement au moment du déploiement, voir le job
# "deploy" de la CI). Ne plus builder localement sur le serveur de prod.
#
# Déploiement (fait par la CI, ou à la main en dépannage) :
#   export MATCHING_API_IMAGE=ghcr.io/99ch/keoni-matching-api
#   export IMAGE_TAG=sha-<commit>   # ou "latest"
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull matching-api
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Tous les ports sont bindés uniquement sur 127.0.0.1 (loopback), jamais exposés publiquement.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: keoni_db_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/prod/db:/var/lib/postgresql/data
    mem_limit: 256m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - keoni_net
  matching-api:
    image: ${MATCHING_API_IMAGE}:${IMAGE_TAG}
    container_name: keoni_matching_api_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MATCHING_API_KEY: ${MATCHING_API_KEY}
      MODEL_CACHE: /models
      DATA_DIR: /data/cv_raw
      MATCHING_PRELOAD_MODEL: ${MATCHING_PRELOAD_MODEL:-1}
      MATCHING_MIN_TITLE_HITS: ${MATCHING_MIN_TITLE_HITS:-3}
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: ${TIMEZONE}
      # Récupération/réindexation sur tout le vivier de CV (/retrieve,
      # /admin/reindex-cvs) -- même identifiant keoni-bridge que n8n. Défaut
      # aligné sur l'URL déjà en dur dans le workflow n8n (Fetch CV L1/L2/L3).
      WP_API_BASE_URL: ${WP_API_BASE_URL:-https://keoni-consulting.net/wp-json/keoni/v1}
      WP_API_KEY: ${WP_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./volumes/models:/models
      - ./volumes/data/cv_raw:/data/cv_raw
    mem_limit: 1536m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - keoni_net
  n8n:
    image: n8nio/n8n:1.123.10
    container_name: keoni_n8n_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_TASK_TIMEOUT: 900
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: 0
      N8N_HOST: 127.0.0.1
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      WP_API_BASE_URL: ${WP_API_BASE_URL}
      MATCHING_API_BASE_URL: ${MATCHING_API_BASE_URL}
      WP_API_KEY: ${WP_API_KEY}
      MATCHING_API_KEY: ${MATCHING_API_KEY}
    depends_on:
      - db
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./volumes/prod/n8n:/home/node/.n8n
    mem_limit: 768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - keoni_net
networks:
  keoni_net:
    driver: bridge
    name: keoni_prod_net

name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "services/matching-api/**"
      - "docker-compose.prod.yml"
      - "ops/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "services/matching-api/**"
      - "docker-compose.prod.yml"
      - "ops/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/keoni-matching-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/matching-api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/matching-api/requirements-dev.txt
      # Volontairement PAS requirements.txt complet : les modules testés
      # (taxonomy.py, extraction.py, scoring.py) sont sans dépendance ML
      # lourde par design (voir leurs docstrings), donc requirements-dev.txt
      # (pytest + libs d'extraction) suffit à faire tourner les 73 tests
      # sans installer torch/sentence-transformers/faiss/tika ici.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        # python -m pytest (pas le seul exécutable pytest) : ajoute le
        # répertoire courant à sys.path, nécessaire pour que `from app import
        # ...` résolve sans installer le package ni ajouter de conftest.py.
        run: python -m pytest tests -q

  build-and-push:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (loaded locally for the smoke check below)
        uses: docker/build-push-action@v6
        with:
          context: services/matching-api
          file: services/matching-api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Smoke-test the image (import app.main, no network/DB needed)
        # Attrape les erreurs d'import/syntaxe que les tests unitaires ne
        # voient jamais : ils n'importent jamais app.main (volontairement
        # léger, voir le job test) donc c'est le seul filet avant prod.
        # app.db se dégrade sans exception si POSTGRES_DSN est absent, et
        # warmup_model() ne se déclenche qu'au démarrage ASGI réel (jamais
        # sur un simple import) -- donc aucun appel réseau ici.
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            python -c "from app.main import app; print('import OK:', app.title)"
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: services/matching-api
          file: services/matching-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Deploy on the production server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          MATCHING_API_IMAGE: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: IMAGE_TAG,MATCHING_API_IMAGE
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Le serveur est un checkout git de ce repo : on le resynchronise
            # sur main avant de relancer, sinon docker-compose.prod.yml et
            # ops/ restent figes sur l'etat importe au premier commit.
            # --ff-only echoue proprement (au lieu d'ecraser) si le checkout
            # local a divergé -- .env.prod et volumes/ sont gitignores, donc
            # jamais concernes par ce pull.
            git fetch origin main
            git merge --ff-only origin/main
            test -f .env.prod
            export IMAGE_TAG="$IMAGE_TAG"
            export MATCHING_API_IMAGE="$MATCHING_API_IMAGE"
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull matching-api
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d matching-api
      - name: Smoke health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" bash ops/monitoring/check_stack.sh
      - name: Prune old matching-api images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            bash ops/scripts/prune_matching_api_images.sh || true
